<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    favicon：黑底板 + 白色图形。
    坐标与 components/ui/Logo.tsx 的 MARK_STEM / MARK_WEDGE 逐字一致（单一事实来源）：
      MARK_STEM rect(6.1,3,3.6,26) ｜ MARK_WEDGE 12.9,16 25.9,3 25.9,29（顶角 90°，底 26）
    这里保留实色底板，与导航 LOGO 去掉底座不冲突：favicon 是浏览器单独加载的独立
    SVG 文档，没有外层主题上下文，图形若用 currentColor 会取 color 的初始值（黑），
    在深色标签栏上等于隐形。因此底板写死 #000000、图形写死 #ffffff，
    与站点终端主题底色（globals.css 的 background #080808、layout.tsx 的
    viewport.themeColor 同为 #080808）保持一致。
    【历史】三笔画、73% 高、等高不等边、等边四版均被否决；现行为等高 + 顶角 90°。
    注意：XML 注释里不能出现连续两个连字符，故此处不写 CSS 变量名。
  -->
  <rect width="32" height="32" fill="#000000"/>
  <g fill="#ffffff">
    <!-- 终端竖线 -->
    <rect x="6.1" y="3" width="3.6" height="26"/>
    <!-- 指向左边的三角（顶角 90 度） -->
    <polygon points="12.9,16 25.9,3 25.9,29"/>
  </g>
</svg>
