name: Generate README projects panel

on:
  schedule:
    # 每天 18:40 UTC（北京时间次日 02:40）刷新一次，错开 snake(18:20) 与 3D(18:00)
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-projects
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 按 star 数取前 6 个非 fork 仓库，渲染成 HUD 卡片面板
      - name: Generate projects panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_projects.py --out dist/assets/projects

      # 推送到 output 分支（与 snake / 3D 贡献图产物同分支，增量合并避免互相覆盖）
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "chore(readme): regenerate projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
