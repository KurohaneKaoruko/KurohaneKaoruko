name: Generate README 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: KurohaneKaoruko

      # 上游 action 固定输出到仓库根目录的 profile-3d-contrib/，
      # 生成后移入 dist/ 统一收纳，最终发布到 output 分支
      - name: Move SVGs into dist/
        run: |
          mkdir -p dist/assets
          rm -rf dist/assets/profile-3d-contrib
          mv profile-3d-contrib dist/assets/

      # 推送到 output 分支（与 snake 产物同分支，采用增量合并，避免互相覆盖）
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "chore(readme): regenerate 3D contribution graph [skip ci]"
