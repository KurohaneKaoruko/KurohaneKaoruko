</linearGradient>
<linearGradient id="fhzG" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#79b8ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="fglow" cx="600" cy="110" r="380" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>
<filter id="fsoft" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

