<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<style>
@keyframes shine{0%{transform:translateX(0)}52%,100%{transform:translateX(1560px)}}
@keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(380px)}}
@keyframes tw{0%,100%{opacity:.06}50%{opacity:.7}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
@keyframes sweep{0%{transform:translateY(-200px)}100%{transform:translateY(384px)}}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bar{0%,100%{opacity:.22}50%{opacity:.95}}
@keyframes flow{to{stroke-dashoffset:-48}}
.shine{animation:shine 7.5s cubic-bezier(.42,0,.28,1) infinite}
.scan{animation:scan 9s linear infinite}
.tw{animation:tw 4.2s ease-in-out infinite}
.blink{animation:blink 1.5s steps(1) infinite}
.led{animation:led 3.2s ease-in-out infinite}
.bar{animation:bar 2.6s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:flow 2.4s linear infinite}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0d1428"/><stop offset="1" stop-color="#0b1020"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow" cx="600" cy="240" r="560" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
  <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#22345c" stroke-width="1"/>
</pattern>
<clipPath id="fclip"><rect width="1200" height="384" rx="18"/></clipPath>
</defs>
