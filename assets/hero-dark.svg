<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<style>
@keyframes shine{0%{transform:translateX(0)}52%,100%{transform:translateX(1560px)}}
@keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(380px)}}
@keyframes tw{0%,100%{opacity:.06}50%{opacity:.7}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
@keyframes sweep{0%{transform:translateY(-200px)}100%{transform:translateY(384px)}}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bar{0%,100%{opacity:.22}50%{opacity:.95}}
@keyframes flow{to{stroke-dashoffset:-48}}
.shine{animation:shine 7.5s cubic-bezier(.42,0,.28,1) infinite}
.scan{animation:scan 9s linear infinite}
.tw{animation:tw 4.2s ease-in-out infinite}
.blink{animation:blink 1.5s steps(1) infinite}
.led{animation:led 3.2s ease-in-out infinite}
.bar{animation:bar 2.6s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:flow 2.4s linear infinite}
</style>
<defs>
<linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#161c24"/><stop offset="1" stop-color="#0d1117"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2=".6">
  <stop offset="0" stop-color="#e6edf3"/><stop offset=".5" stop-color="#adbac7"/><stop offset="1" stop-color="#8b949e"/>
</linearGradient>
<linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e6edf3" stop-opacity="0"/>
  <stop offset=".5" stop-color="#e6edf3" stop-opacity="0.07"/>
  <stop offset="1" stop-color="#e6edf3" stop-opacity="0"/>
</linearGradient>
<pattern id="hgrid" width="48" height="48" patternUnits="userSpaceOnUse">
  <path d="M48 0H0V48" fill="none" stroke="#21262d" stroke-width="1"/>
</pattern>
<filter id="soft" x="-25%" y="-70%" width="150%" height="240%">
  <feGaussianBlur stdDeviation="16"/>
</filter>
<mask id="nm" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
  <text x="600" y="190" text-anchor="middle" font-size="76" font-weight="800" letter-spacing="10" fill="#ffffff">KUROHANE KAORUKO</text>
</mask>
<clipPath id="hclip"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<g clip-path="url(#hclip)">
<rect width="1200" height="360" fill="url(#hbg)"/>
<rect width="1200" height="360" fill="url(#hgrid)" opacity="0.22"/>
<circle class="tw" style="animation-delay:0.00s" cx="96" cy="88" r="1.00" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:0.37s" cx="188" cy="214" r="1.35" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:0.74s" cx="262" cy="62" r="1.70" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:1.11s" cx="352" cy="300" r="1.00" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:1.48s" cx="438" cy="128" r="1.35" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:1.85s" cx="512" cy="40" r="1.70" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:2.22s" cx="596" cy="330" r="1.00" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:2.59s" cx="676" cy="96" r="1.35" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:2.96s" cx="742" cy="264" r="1.70" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:3.33s" cx="836" cy="60" r="1.00" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:3.70s" cx="908" cy="306" r="1.35" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:4.07s" cx="1002" cy="140" r="1.70" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:4.44s" cx="1064" cy="232" r="1.00" fill="#ffffff" opacity=".2"/><circle class="tw" style="animation-delay:4.81s" cx="1128" cy="78" r="1.35" fill="#ffffff" opacity=".2"/>
<rect class="scan" x="0" y="-60" width="1200" height="60" fill="url(#scanG)"/>
<text x="600" y="190" text-anchor="middle" font-size="76" font-weight="800" letter-spacing="10" fill="#e6edf3" opacity=".14" filter="url(#soft)">KUROHANE KAORUKO</text>
<g mask="url(#nm)">
  <rect width="1200" height="360" fill="url(#nameGrad)"/>
  <g class="shine"><path d="M-240 0 L-120 0 L-3 360 L-123 360 Z" fill="url(#shineG)"/></g>
</g>
<text x="44" y="46" font-size="11" letter-spacing="3.2" fill="#6e7681">// PROFILE</text>
<rect class="blink" x="154" y="37" width="7" height="10" rx="1" fill="#ff453a"/>
<text x="1156" y="46" text-anchor="end" font-size="11" letter-spacing="3.2" fill="#6e7681">NIGHT OWL</text>
<line x1="420" y1="226" x2="780" y2="226" stroke="#30363d" stroke-opacity=".9"/>
<line x1="600" y1="221" x2="600" y2="231" stroke="#ff453a" stroke-opacity=".9"/>
<text x="600" y="258" text-anchor="middle" font-size="13" letter-spacing="6.5" fill="#8b949e">AI ENGINEER · TOOLMAKER · NIGHT OWL</text>
<text x="600" y="316" text-anchor="middle" font-size="12" letter-spacing="5.5" fill="#ff453a">COMPILE THIS WORLD.</text>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#30363d"/>
</svg>