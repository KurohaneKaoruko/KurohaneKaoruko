<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<style>
@keyframes sweep{0%{transform:translateY(-200px)}100%{transform:translateY(384px)}}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes bar{0%,100%{opacity:.22}50%{opacity:.95}}
@keyframes card{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@keyframes flow{to{stroke-dashoffset:-48}}
.sweep{animation:sweep 8s linear infinite}
.led{animation:led 3.2s ease-in-out infinite}
.blink{animation:blink 1.5s steps(1) infinite}
.bar{animation:bar 2.6s ease-in-out infinite}
.card{animation:card 5s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:flow 2.4s linear infinite}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
</linearGradient>
<linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
  <stop offset=".5" stop-color="#0969da" stop-opacity="0.06"/>
  <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow" cx="600" cy="240" r="560" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#0969da" stop-opacity="0.04"/>
  <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#d0d7de" stroke-width="1"/>
</pattern>
<clipPath id="clip"><rect width="1200" height="384" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="384" fill="url(#bg)"/>
<rect width="1200" height="384" fill="url(#grid)" opacity="0.38"/>
<rect width="1200" height="384" fill="url(#glow)"/>
<g class="sweep"><rect x="0" y="-200" width="1200" height="200" fill="url(#sweepG)"/></g>
<line x1="0" y1="52" x2="1200" y2="52" stroke="#d0d7de" stroke-opacity=".7"/>
<text x="44" y="35" font-size="18" font-weight="700" fill="#0969da" letter-spacing=".5">&gt; focus</text>
<circle class="blink" cx="1022" cy="29" r="4.5" fill="#1a7f37"/>
<text x="1156" y="34" text-anchor="end" font-size="11" letter-spacing="2.4" fill="#8c959f">SYSTEM ONLINE</text>
<g fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="1.5"><path d="M20 44V22a2 2 0 0 1 2-2h22"/><path d="M1180 44V22a2 2 0 0 0-2-2h-22"/><path d="M20 340v22a2 2 0 0 0 2 2h22"/><path d="M1180 340v22a2 2 0 0 1-2 2h-22"/></g><rect x="68" y="82" width="2.5" height="34" rx="1.2" fill="url(#accent)" opacity=".9"/><text x="44" y="104" font-size="12" letter-spacing="1" fill="#8c959f">01</text><text x="88" y="103" font-size="17" font-weight="700" fill="#1f2328">LLM Agents</text><text x="88" y="123" font-size="13" fill="#57606a">让模型自主决定下一步，而不是只回答单轮问题</text><line class="flow" x1="760" y1="100" x2="1118" y2="100" stroke="#0969da" stroke-opacity=".2"/><circle class="led" style="animation-delay:0.00s" cx="1146" cy="100" r="3.2" fill="#1a7f37"/><line x1="44" y1="130" x2="1156" y2="130" stroke="#d0d7de" stroke-opacity=".45"/><rect x="68" y="136" width="2.5" height="34" rx="1.2" fill="url(#accent)" opacity=".9"/><text x="44" y="158" font-size="12" letter-spacing="1" fill="#8c959f">02</text><text x="88" y="157" font-size="17" font-weight="700" fill="#1f2328">Swarm Intelligence</text><text x="88" y="177" font-size="13" fill="#57606a">多 Agent 协作、任务分配与集群行为</text><line class="flow" x1="760" y1="154" x2="1118" y2="154" stroke="#0969da" stroke-opacity=".2"/><circle class="led" style="animation-delay:0.55s" cx="1146" cy="154" r="3.2" fill="#1a7f37"/><line x1="44" y1="184" x2="1156" y2="184" stroke="#d0d7de" stroke-opacity=".45"/><rect x="68" y="190" width="2.5" height="34" rx="1.2" fill="url(#accent)" opacity=".9"/><text x="44" y="212" font-size="12" letter-spacing="1" fill="#8c959f">03</text><text x="88" y="211" font-size="17" font-weight="700" fill="#1f2328">Dev Tools</text><text x="88" y="231" font-size="13" fill="#57606a">把重复的操作做成工具</text><line class="flow" x1="760" y1="208" x2="1118" y2="208" stroke="#0969da" stroke-opacity=".2"/><circle class="led" style="animation-delay:1.10s" cx="1146" cy="208" r="3.2" fill="#1a7f37"/><line x1="44" y1="238" x2="1156" y2="238" stroke="#d0d7de" stroke-opacity=".45"/><rect x="68" y="244" width="2.5" height="34" rx="1.2" fill="url(#accent)" opacity=".9"/><text x="44" y="266" font-size="12" letter-spacing="1" fill="#8c959f">04</text><text x="88" y="265" font-size="17" font-weight="700" fill="#1f2328">Games</text><text x="88" y="285" font-size="13" fill="#57606a">Screeps 自动化脚本与配套工具</text><line class="flow" x1="760" y1="262" x2="1118" y2="262" stroke="#0969da" stroke-opacity=".2"/><circle class="led" style="animation-delay:1.65s" cx="1146" cy="262" r="3.2" fill="#1a7f37"/><line x1="44" y1="304" x2="1156" y2="304" stroke="#d0d7de" stroke-opacity=".8"/><text x="44" y="336" font-size="11" letter-spacing="2.4" fill="#8c959f">STACK</text><rect x="118" y="316" width="112" height="30" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-opacity=".85"/><circle cx="134" cy="331" r="3.5" fill="#a05a2c"/><text x="146" y="336" font-size="12" fill="#1f2328">Rust</text><rect x="242" y="316" width="112" height="30" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-opacity=".85"/><circle cx="258" cy="331" r="3.5" fill="#3572A5"/><text x="270" y="336" font-size="12" fill="#1f2328">Python</text><rect x="366" y="316" width="112" height="30" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-opacity=".85"/><circle cx="382" cy="331" r="3.5" fill="#3178c6"/><text x="394" y="336" font-size="12" fill="#1f2328">TypeScript</text><rect x="490" y="316" width="112" height="30" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-opacity=".85"/><circle cx="506" cy="331" r="3.5" fill="#111111"/><text x="518" y="336" font-size="12" fill="#1f2328">Next.js</text><rect x="614" y="316" width="112" height="30" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-opacity=".85"/><circle cx="630" cy="331" r="3.5" fill="#b8860b"/><text x="642" y="336" font-size="12" fill="#1f2328">Tauri</text><rect x="738" y="316" width="112" height="30" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-opacity=".85"/><circle cx="754" cy="331" r="3.5" fill="#3c873a"/><text x="766" y="336" font-size="12" fill="#1f2328">Node.js</text></g>
<rect x=".5" y=".5" width="1199" height="383" rx="18" fill="none" stroke="#d0d7de" stroke-opacity=".9"/>
</svg>
